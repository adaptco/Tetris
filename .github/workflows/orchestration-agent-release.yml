name: Orchestration Agent Release

on:
  workflow_dispatch:

jobs:
  build-test-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Make runtime scripts executable
        run: chmod +x scripts/generate_orchestration_bundle.sh

      - name: Generate orchestration runtime bundle
        run: ./scripts/generate_orchestration_bundle.sh

      - name: Run C++ tests
        run: |
          cd build/orchestration
          ctest --output-on-failure

      - name: Run Python tests
        run: pytest tests/

      - name: Package runtime bundle
        run: |
          mkdir -p dist
          tar -czvf dist/orchestration-agent.tar.gz -C build/orchestration orchestration_agent

      - name: Upload runtime artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: orchestration-agent-bundle
          path: dist/orchestration-agent.tar.gz
