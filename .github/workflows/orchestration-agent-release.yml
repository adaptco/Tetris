name: Orchestration Agent Release

on:
  workflow_dispatch:

jobs:
  build-test-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
          python -m pip install --upgrade pip
          pip install pytest

      - name: Configure and Build
        run: |
          mkdir -p build
          cd build
          cmake ..
          make -j$(nproc)

      - name: Run C++ tests
        run: |
          cd build
          ctest --output-on-failure

      - name: Run Python tests
        run: pytest tests/

      - name: Package runtime bundle
        run: |
          mkdir -p dist
          # Ensure we are grabbing the binary from the correct build path
          tar -czvf dist/orchestration-agent.tar.gz -C build/orchestration orchestration_agent

      - name: Upload runtime artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: orchestration-agent-bundle
          path: dist/orchestration-agent.tar.gz
